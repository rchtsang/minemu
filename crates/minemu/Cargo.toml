[package]
name = "minemu"
version = "0.1.0"
edition = "2024"

[dependencies]
minemu-image = { path = "../minemu-image" }
minemu-runtime = { path = "../minemu-runtime" }
minemu-core = { path = "../minemu-core" }
minemu-platform = { path = "../minemu-platform" }
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
toml = "0.9.12"
ratatui = "0.29.0"
crossterm = "0.28.1"
capstone = "0.13.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
